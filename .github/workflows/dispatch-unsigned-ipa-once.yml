# Temporary bootstrap for this implementation; removed in the next commit.
# The running job dispatches the permanent workflow only after that removal.
name: Dispatch unsigned IPA once

on:
  push:
    branches: [main]
    paths: [.github/workflows/dispatch-unsigned-ipa-once.yml]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for bootstrap removal and dispatch final main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            remaining=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/main?recursive=1" \
              --jq '[.tree[] | select(.path == ".github/workflows/dispatch-unsigned-ipa-once.yml")] | length')
            if [ "$remaining" = "0" ]; then
              head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
              echo "Dispatching iOS Unsigned IPA at main: $head_sha"
              gh workflow run ios-unsigned-ipa.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for bootstrap removal.' >&2
          exit 1
